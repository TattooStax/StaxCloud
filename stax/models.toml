# StaxCloud model pins — one place for which model does which job.
#
# Each role names the hands it drives. `stax/apply-models.py` writes these
# values into the hands' HAND.toml files (the sources in stax/hands/, and with
# --installed the live copies in ~/.openfang/hands/). Swapping a model is an
# edit here plus one run of that script — no hand files edited by hand.
#
# "default" means the daemon's default model from config.toml.
#
# Values as running on the live box after the strike-7/8 deploys (Muse's
# reports, 2026-11-10), plus Strike 10: the background workers move off the
# daemon default (meta-llama/llama-3.3-70b-instruct) onto the benchmarked
# cheap driver. Prices synced 2026-11-10: gemma-4-26b $0.08/$0.10 per M,
# qwen3.7-flash $0.03/$0.13, gemma-4-31b $0.20/$0.40.

[roles.lead]
hands = ["stax"]
provider = "openrouter"
model = "google/gemma-4-26b-a4b-it"

[roles.workers]
# background sweeps: form intake, text threads, boards
hands = ["forms", "sms", "surface-builder", "style"]
provider = "openrouter"
model = "google/gemma-4-26b-a4b-it"

[roles.router]
hands = ["decider"]
provider = "openrouter"
model = "qwen/qwen3.7-flash"

[roles.memory]
hands = ["memory"]
provider = "openrouter"
model = "qwen/qwen3.7-flash"

[roles.deep_work]
hands = ["deep-work"]
provider = "openrouter"
model = "moonshotai/kimi-k2-0905"

[roles.vision]
# reads reference photos and the artist's portfolio
hands = ["designer"]
provider = "openrouter"
model = "google/gemma-4-31b-it"

[roles.upstream]
# OpenFang's own hands, kept on the default
hands = ["lead", "researcher"]
provider = "default"
model = "default"

[image]
# Designs made in chat (image_generate reads STAX_IMAGE_MODEL) and by the
# designer sidecar (DESIGNER_GEN_MODEL). apply-models.py prints the lines to
# set; it never edits env files, which also hold the API key.
model = "openai/gpt-image-2"

[vision]
# Reads pictures for image_describe — the Style helper's portfolio reading and
# customer references (STAX_VISION_MODEL).
model = "google/gemma-4-31b-it"
