[roles.vision]
# Only runs when --images points at a folder of portfolio photos.
candidates = [
  # nemotron-3.5-super-vl dropped: empty answers on all 30 portfolio photos (2026-11-09 run)
  { id = "google/gemma-4-31b-it", variants = ["full"] },
  { id = "z-ai/glm-5.3-flash", variants = ["full"] },
  { id = "qwen/qwen3.8-flash" },
  { id = "google/gemini-2.5-flash" },   # what the designer reads with today (baseline)
]

[roles.image]
candidates = [
