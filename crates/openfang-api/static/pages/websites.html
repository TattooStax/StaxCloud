
    <!-- Page: Websites (Studio module) -->
    <template x-if="page === 'websites'">
      <div x-data="websitesPage" x-init="loadData()">
        <div class="page-header">
          <h2>Websites</h2>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn btn-ghost btn-sm" @click="loadData()">Refresh</button>
            <button class="btn btn-ghost" @click="$store.app.staxAgent(); goSurface('home')" aria-label="Done, back to Stax">Done</button>
          </div>
        </div>
        <div class="page-body">
          <div x-show="loading" class="text-dim" style="padding:12px">Loading your websites...</div>
          <div x-show="!loading && loadError" class="error-state">
            <h3 style="color:var(--error)">Could not load your websites</h3>
            <p class="text-xs text-dim" x-text="loadError"></p>
            <button class="btn btn-primary btn-sm" @click="loadData()" style="margin-top:8px">Retry</button>
          </div>

          <!-- My Sites -->
          <div x-show="!loading && !loadError && tab === 'sites'">
            <p class="text-sm text-dim" style="margin:2px 0 6px">Your websites. Preview any of them here as much as you like — previews are free. Publishing is what your plan counts.</p>
            <p class="text-sm" style="margin:0 0 16px" x-show="plan" x-text="countLine"></p>
            <p class="text-sm text-dim" style="margin:0 0 16px" x-show="!plan">Publishing plan is not set yet — ask Stax.</p>
            <div x-show="sites.length === 0" class="empty-state">
              <h4>No websites yet</h4>
              <p class="hint">Ask Stax: &ldquo;Build me a website for the shop.&rdquo;</p>
            </div>
            <div class="card-grid">
              <template x-for="s in sites" :key="s.slug">
                <div class="card">
                  <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
                    <span class="card-header" style="margin:0;font-size:15px;font-weight:600" x-text="s.title"></span>
                    <span class="badge" :class="s.status === 'published' ? 'badge-success' : 'badge-dim'" style="font-size:10px" x-text="stateWord(s)"></span>
                  </div>
                  <div class="text-sm text-dim" style="margin-top:4px" x-text="s.fileCount + (s.fileCount === 1 ? ' file' : ' files')"></div>
                  <div x-show="s.status === 'published' && s.url" class="text-xs" style="margin-top:6px"><a :href="s.url" target="_blank" rel="noopener" style="color:var(--accent)" x-text="s.url"></a></div>
                  <div x-show="s.domain" class="text-xs" style="margin-top:6px"><span class="text-dim">Domain: </span><a x-show="s.domainState === 'attached'" :href="'https://' + s.domain" target="_blank" rel="noopener" style="color:var(--accent)" x-text="s.domain"></a><span x-show="s.domainState !== 'attached'" x-text="s.domain"></span><span class="text-dim"> &middot; </span><span :style="s.domainState.indexOf('failed') === 0 ? 'color:var(--error)' : ''" x-text="s.domainState"></span></div>
                  <div class="text-xs" style="margin-top:4px"><span class="text-dim">Rate limit: </span><span x-text="s.ratelimits"></span></div>
                  <div x-show="refusalFor(s)" class="text-sm" style="margin-top:8px;color:var(--error)" x-text="refusalFor(s)"></div>
                  <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
                    <button class="btn btn-ghost btn-sm" @click="showPreview(s)">Preview</button>
                    <button class="btn btn-primary btn-sm" x-show="s.status !== 'published'" :disabled="busySlug === s.slug || !!pendingJob(s.slug)" @click="publishSite(s)">Publish</button>
                    <button class="btn btn-ghost btn-sm" x-show="s.status === 'published'" :disabled="busySlug === s.slug || !!pendingJob(s.slug)" @click="publishSite(s)">Republish</button>
                    <button class="btn btn-ghost btn-sm" x-show="s.status === 'published'" :disabled="busySlug === s.slug || !!pendingJob(s.slug)" @click="unpublishSite(s)">Unpublish</button>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- Preview -->
          <div x-show="!loading && !loadError && tab === 'preview'">
            <div x-show="sites.length === 0" class="empty-state">
              <h4>Nothing to preview</h4>
              <p class="hint">Once a website exists, you can see it here.</p>
            </div>
            <div x-show="sites.length > 0">
              <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
                <template x-for="s in sites" :key="s.slug">
                  <button class="stax-chip" :class="{ active: previewSlug === s.slug }" @click="previewSlug = s.slug; loadPreview()" x-text="s.title"></button>
                </template>
              </div>
              <p class="text-xs text-dim" style="margin:0 0 10px">This is how the site looks. It is a preview inside the app — nothing here is on the internet.</p>
              <div x-show="previewBusy" class="text-dim" style="padding:12px">Making the preview...</div>
              <p class="text-sm" style="color:var(--error)" x-show="!previewBusy && previewNote" x-text="previewNote"></p>
              <iframe x-show="!previewBusy && previewHtml" :srcdoc="previewHtml" sandbox="allow-scripts" title="Website preview" style="width:100%;height:70vh;border:1px solid var(--border);border-radius:8px;background:#fff"></iframe>
            </div>
          </div>
        </div>
      </div>
    </template>
