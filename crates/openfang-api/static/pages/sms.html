
    <!-- Page: Texts (R9 graft) -->
    <template x-if="page === 'sms'">
      <div x-data="smsPage" x-init="loadData()">
        <div class="page-header">
          <h2>Texts</h2>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn btn-ghost btn-sm" @click="loadData()">Refresh</button>
            <button class="btn btn-ghost" @click="$store.app.staxAgent(); goSurface('home')" aria-label="Done, back to Stax">Done</button>
          </div>
        </div>
        <div class="page-body" :class="{ 'sms-body': tab === 'inbox' && !!selected }">
          <div x-show="loading" class="text-dim" style="padding:12px">Loading texts...</div>
          <div x-show="!loading && loadError" class="error-state">
            <h3 style="color:var(--error)">Could not load texts</h3>
            <p class="text-xs text-dim" x-text="loadError"></p>
            <button class="btn btn-primary btn-sm" @click="loadData()" style="margin-top:8px">Retry</button>
          </div>

          <div class="sms-main" x-show="!loading && !loadError && tab === 'inbox'">
            <div x-show="threads.length === 0" class="empty-state">
              <h4>No texts yet</h4>
              <p class="hint">When the modem bridge is connected, conversations from the studio line land here — and replies you approve go out from here.</p>
            </div>

            <div class="people-list" x-show="!selected">
              <template x-for="th in threads" :key="th.key">
                <button class="thread-row" @click="openThread(th)">
                  <span class="thread-avatar" x-text="(th.name || th.number || '?').split(/\s+/).map(function(w){return w.charAt(0)}).join('').slice(0,2).toUpperCase()"></span>
                  <span class="thread-copy">
                    <span class="thread-name" x-text="th.name || prettyNumber(th.number)"></span>
                    <span class="thread-snippet text-dim" x-text="snippet(th)"></span>
                  </span>
                  <span class="thread-meta">
                    <span class="thread-small" x-text="lastMsg(th) ? fmtTs(lastMsg(th).ts) : ''"></span>
                    <span x-show="th.test" class="badge badge-dim" style="font-size:10px">test</span>
                  </span>
                </button>
              </template>
            </div>

            <div class="conv-wrap" x-show="selected">
              <div class="conv-head">
                <button class="btn btn-ghost btn-sm" @click="selectedKey = ''" style="min-height:44px">&larr; All conversations</button>
                <div style="font-weight:700;font-size:15px;margin-top:6px" x-text="selected ? (selected.name || prettyNumber(selected.number)) : ''"></div>
                <div class="text-xs text-dim" x-text="selected ? prettyNumber(selected.number) : ''"></div>
              </div>
              <div class="conv-scroll" x-ref="convScroll">
                <template x-for="(m, i) in (selected ? selected.messages : [])" :key="i">
                  <div class="conv-row" :class="m.dir === 'out' ? 'conv-row-own' : ''">
                    <div class="conv-meta">
                      <span class="conv-author" x-text="m.dir === 'out' ? 'You' : (selected ? (selected.name || prettyNumber(selected.number)) : '')"></span>
                      <span class="conv-outside" x-show="m.dir !== 'out'">Outside the shop</span>
                      <span class="conv-time" x-text="fmtTs(m.ts)"></span>
                      <span class="conv-status" x-text="m.dir === 'out' ? (m.held ? 'Held - in Needs you' : (m.status || '')) : ''"></span>
                    </div>
                    <div class="conv-bubble" :class="m.dir === 'out' ? 'conv-bubble-own' : ''">
                      <div class="conv-body" x-text="m.body"></div>
                      <div class="conv-body" x-show="m.media && m.media.length && !(m.body || '').trim()" x-text="(m.media && m.media.some(function(x){ return (x.mime || '').indexOf('image/') === 0; })) ? 'Photo' : 'Attachment'"></div>
                    </div>
                  </div>
                </template>
                <div style="margin-top:6px" x-show="outbox.length">
                  <div style="font-weight:600;font-size:13px;margin-bottom:6px">Outbox</div>
                  <template x-for="o in outbox" :key="o.key">
                    <div class="text-sm" style="display:flex;gap:8px"><span class="badge" :class="o.status === 'delivered' ? 'badge-success' : (o.status === 'failed' ? 'badge-dim' : 'badge-warn')" style="font-size:10px" x-text="o.status"></span><span style="flex:1;min-width:0" x-text="o.body"></span></div>
                  </template>
                </div>
              </div>
              <div class="conv-compose">
                <textarea class="form-textarea" style="width:100%" rows="3" placeholder="Write a reply - it waits in Needs you before anything is sent" x-model="convDraft"></textarea>
                <button class="btn btn-primary" style="margin-top:8px;min-height:44px" @click="convSubmit()" :disabled="convSending || !convDraft.trim()">Hold reply for approval</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>
