
    <!-- Page: Approvals (Work) — Needs you / Current work / Finished.
         The header count is the shell store's, the same number Home
         and the floating pill show. -->
    <template x-if="page === 'approvals'">
      <div x-data="approvalsPage()" x-init="init()">
        <div class="page-header">
          <h2>Needs you</h2>
          <div class="flex items-center gap-2">
            <span class="badge badge-warn" x-show="$store.app.pendingApprovalCount > 0" x-text="$store.app.pendingApprovalCount + ' pending'"></span>
            <button class="btn btn-ghost btn-sm" @click="loadData()">Refresh</button>
          <button class="btn btn-ghost" @click="$store.app.staxAgent(); goSurface('home')" aria-label="Done, back to Stax">Done</button>
          </div>
        </div>
        <div class="page-body">
          <div x-show="loading" class="loading-state"><div class="spinner"></div><span>Loading...</span></div>
          <div x-show="!loading && loadError" class="error-state">
            <span class="error-icon">!</span>
            <p x-text="loadError"></p>
            <button class="btn btn-ghost btn-sm" @click="loadData()">Retry</button>
          </div>
          <template x-if="!loading && !loadError">
            <div id="work-needsyou">
              <div x-show="heldBackCount > 0" role="status" aria-live="polite" style="border:1px solid var(--border,#3a3f4a);border-radius:10px;padding:10px 14px;margin-bottom:14px">
                <span style="font-weight:600" x-text="heldBackCount + ' held back — the queue is full'"></span>
                <span class="text-xs text-dim" style="margin-left:8px" x-text="heldBackSeats"></span>
                <p class="hint" style="margin:4px 0 0">Nothing is lost. Each one joins the list above as soon as a decision frees up room.</p>
              </div>
              <div x-show="unownedAsks.length > 0" role="status" aria-live="polite" style="border:1px solid var(--border,#3a3f4a);border-radius:10px;padding:10px 14px;margin-bottom:14px">
                <span style="font-weight:600" x-text="unownedAsks.length + (unownedAsks.length === 1 ? ' open ask' : ' open asks') + ' — nobody here can do these yet'"></span>
                <template x-for="ask in unownedAsks" :key="ask.key">
                  <p class="text-sm" style="margin:8px 0 0;line-height:1.5">
                    <span x-text="'\u201C' + ask.request + '\u201D'"></span>
                    <span x-text="' — ' + ask.reason"></span>
                    <span class="text-xs text-dim" style="display:block;margin-top:2px" x-text="'Logged ' + timeAgo(ask.ts) + ' · stays here until you act on it, decline it, or the capability ships'"></span>
                  </p>
                </template>
              </div>
              <div x-show="pendingList.length === 0 && unownedAsks.length === 0" class="empty-state">
                <h4>Nothing needs you</h4>
                <p class="hint">When a helper wants to do something sensitive, it will ask here first — and on Home, in your conversation with Stax.</p>
              </div>
              <div class="card-grid">
                <template x-for="a in pendingList" :key="a.id">
                  <div class="card approval-card pending">
                    <div class="flex justify-between items-center mb-2">
                      <span class="badge badge-warn">Waiting for you</span>
                      <span class="text-xs text-dim" x-text="timeAgo(a.created_at)"></span>
                    </div>
                    <div style="font-size:15px;font-weight:600;line-height:1.45;margin-bottom:4px" x-html="$store.app.plainLinked(cardTitle(a))"></div>
                    <div class="text-xs text-dim"><span x-text="bylineName(a)"></span> is asking first &middot; <span x-text="a.action"></span></div>
                    <button class="btn btn-ghost btn-sm" style="margin-top:8px" x-show="previewLines(a).length" @click="toggleExpand(a)" :aria-expanded="expandedId === a.id" x-text="expandedId === a.id ? 'Hide the details' : 'See what happens'"></button>
                    <div x-show="expandedId === a.id" style="margin-top:8px">
                      <template x-if="designOf(a) && designOf(a).state === 'loading'">
                        <p class="text-sm text-dim" style="margin:0 0 6px">Getting the picture\u2026</p>
                      </template>
                      <template x-if="designOf(a) && designOf(a).state === 'ready'">
                        <div style="margin-bottom:8px">
                          <img :src="designOf(a).img" :alt="designOf(a).title || 'The design'" style="display:block;max-width:100%;border-radius:10px;border:1px solid var(--border,#3a3f4a)">
                          <p class="text-sm" style="margin:6px 0 2px;line-height:1.5" x-text="designOf(a).title"></p>
                          <p class="text-xs text-dim" style="margin:0 0 2px" x-text="designOf(a).versions + (designOf(a).versions === 1 ? ' version' : ' versions') + ' \u2014 this is the newest one'"></p>
                          <p class="text-xs text-dim" style="margin:0 0 6px" x-show="designOf(a).customer" x-text="'Customer: ' + $store.app.fmtPhones(designOf(a).customer)"></p>
                          <button class="btn btn-ghost btn-sm" @click="openInCanvas(a)">Open in Canvas</button>
                        </div>
                      </template>
                      <template x-if="designOf(a) && designOf(a).state === 'none'">
                        <div style="margin-bottom:8px">
                          <p class="text-sm" style="margin:0 0 6px">No picture stored for this one.</p>
                          <button class="btn btn-ghost btn-sm" x-show="designOf(a).latestId" @click="openInCanvas(a)">Open in Canvas</button>
                        </div>
                      </template>
                      <template x-if="designOf(a) && designOf(a).state === 'error'">
                        <div style="margin-bottom:8px">
                          <p class="text-sm" style="margin:0 0 6px">The picture couldn't load just now.</p>
                          <button class="btn btn-ghost btn-sm" x-show="designOf(a).latestId" @click="openInCanvas(a)">Open in Canvas</button>
                        </div>
                      </template>
                      <template x-for="line in previewLines(a)" :key="line">
                        <p class="text-sm" style="margin:0 0 4px;line-height:1.5;word-break:break-word" x-text="line"></p>
                      </template>
                    </div>
                    <div class="approval-actions" style="display:flex;gap:8px;margin-top:12px">
                      <button class="btn btn-success" @click="approve(a.id)">Approve</button>
                      <button class="btn btn-ghost" style="color:var(--danger,#e5534b)" @click="reject(a)">Reject</button>
                    </div>
                  </div>
                </template>
              </div>

              <div style="margin-top:22px" id="work-current">
                <button class="btn btn-ghost" style="width:100%;justify-content:space-between" @click="showCurrent = !showCurrent; $store.app.workSection = showCurrent ? 'current' : 'needsyou'" :aria-expanded="showCurrent">
                  <span>Current work</span>
                  <span class="text-xs text-dim" x-text="jobs.length + (jobs.length === 1 ? ' scheduled check' : ' scheduled checks')"></span>
                </button>
                <div x-show="showCurrent" style="margin-top:10px">
                  <div x-show="jobs.length === 0" class="empty-state"><p class="hint">No scheduled checks right now.</p></div>
                  <template x-for="j in jobs" :key="j.id">
                    <div class="card" style="margin-bottom:8px">
                      <div class="text-sm" style="font-weight:600" x-text="jobName(j)"></div>
                      <div class="text-xs text-dim" x-text="jobWhen(j)"></div>
                    </div>
                  </template>
                </div>
              </div>

              <div style="margin-top:14px" id="work-finished">
                <button class="btn btn-ghost" style="width:100%;justify-content:space-between" @click="showFinished = !showFinished; $store.app.workSection = showFinished ? 'finished' : 'needsyou'" :aria-expanded="showFinished">
                  <span>Finished</span>
                  <span class="text-xs text-dim" x-text="decidedList.length + (decidedList.length === 1 ? ' decision' : ' decisions')"></span>
                </button>
                <div x-show="showFinished" style="margin-top:10px">
                  <div x-show="decidedList.length === 0" class="empty-state"><p class="hint">No decisions yet.</p></div>
                  <div class="card-grid">
                    <template x-for="a in decidedList" :key="a.id">
                      <div class="card approval-card" :class="{ approved: a.status === 'approved', rejected: a.status === 'rejected', expired: a.status === 'expired' }">
                        <div class="flex justify-between items-center mb-2">
                          <span class="badge" :class="{ 'badge-success': a.status === 'approved', 'badge-error': a.status === 'rejected', 'badge-muted': a.status === 'expired' }" x-text="a.status"></span>
                          <span class="text-xs text-dim" x-text="timeAgo(a.created_at)"></span>
                        </div>
                        <div style="font-size:15px;font-weight:600;line-height:1.45;margin-bottom:4px" x-html="$store.app.plainLinked(cardTitle(a))"></div>
                        <div class="text-xs text-dim"><span x-text="bylineName(a)"></span> asked first &middot; <span x-text="a.action"></span></div>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>
