
    <!-- Page: Forms (R7 graft) -->
    <template x-if="page === 'forms'">
      <div x-data="formsPage" x-init="loadData()">
        <div class="page-header">
          <h2>Forms</h2>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn btn-ghost btn-sm" @click="loadData()">Refresh</button>
            <button class="btn btn-ghost" @click="$store.app.staxAgent(); goSurface('home')" aria-label="Done, back to Stax">Done</button>
          </div>
        </div>
        <div class="page-body" :class="{ 'fb-split': building }">
          <div x-show="loading" class="text-dim" style="padding:12px">Loading forms...</div>
          <div x-show="!loading && loadError" class="error-state">
            <h3 style="color:var(--error)">Could not load forms</h3>
            <p class="text-xs text-dim" x-text="loadError"></p>
            <button class="btn btn-primary btn-sm" @click="loadData()" style="margin-top:8px">Retry</button>
          </div>

          <!-- My Forms -->
          <div x-show="!loading && !loadError && tab === 'forms'">
            <div class="fb-bar">
              <p class="text-sm text-dim" style="margin:0;flex:1;min-width:200px">Your forms and what each one has collected. Build one here, or ask the Forms helper in the Agent tab.</p>
              <button class="btn btn-primary" style="min-height:44px" @click="showTemplates = !showTemplates" :aria-expanded="showTemplates">+ New form</button>
            </div>
            <div class="card fb-templates" x-show="showTemplates">
              <div style="font-weight:600;margin-bottom:10px">Start from</div>
              <div class="fb-template-grid">
                <button class="fb-template" @click="startNew('consent')"><strong>Tattoo consent</strong><span>Client details, medical disclosure, terms, aftercare, photo release, signature</span></button>
                <button class="fb-template" @click="startNew('booking')"><strong>Booking request</strong><span>Who they are, the tattoo they want, which artist, reference photos</span></button>
                <button class="fb-template" @click="startNew('contact')"><strong>Contact form</strong><span>Name, email, phone and a message</span></button>
                <button class="fb-template" @click="startNew('blank')"><strong>Blank</strong><span>Start empty and add your own blocks</span></button>
              </div>
            </div>
            <div class="people-alert" x-show="draft && draftDirty" style="margin-bottom:14px">
              <p class="people-alert-title">Unsaved changes to <span x-text="draft ? draft.title : ''"></span></p>
              <div style="display:flex;gap:8px;margin-top:6px">
                <button class="btn btn-primary btn-sm" @click="$store.app.formsTab = 'build'">Keep editing</button>
                <button class="btn btn-ghost btn-sm" @click="discardDraft()">Discard</button>
              </div>
            </div>
            <div x-show="defs.length === 0 && !showTemplates" class="empty-state">
              <h4>No forms yet</h4>
              <p class="hint">Tap New form to build one — a consent form takes about a minute from the template.</p>
            </div>
            <div class="card-grid">
              <template x-for="d in defs" :key="d.slug">
                <div class="card">
                  <div style="display:flex;align-items:baseline;gap:8px">
                    <div class="card-header" style="margin:0;font-size:15px;font-weight:600;flex:1;min-width:0" x-text="d.title"></div>
                    <span class="badge" :class="d.published ? 'badge-success' : 'badge-dim'" style="font-size:10px" x-text="d.published ? 'Published' : 'Draft'"></span>
                    <span class="badge badge-dim" style="font-size:10px" x-show="d.by_stax">Drafted by Stax — review</span>
                  </div>
                  <div class="text-sm text-dim" style="margin-top:4px" x-text="d.fields.length + (d.fields.length === 1 ? ' block · ' : ' blocks · ') + subsOf(d.slug).length + (subsOf(d.slug).length === 1 ? ' submission' : ' submissions')"></div>
                  <div x-show="d.published" class="fb-link">
                    <a :href="formLink(d.slug)" target="_blank" rel="noopener" x-text="formLink(d.slug)"></a>
                    <button class="btn btn-ghost btn-sm" @click="copyLink(d.slug)">Copy link</button>
                  </div>
                  <div x-show="d.public_url" class="text-xs" style="margin-top:6px"><a :href="d.public_url" target="_blank" rel="noopener" style="color:var(--accent)">Older public link</a></div>
                  <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
                    <button class="btn btn-primary btn-sm" @click="editForm(d.slug)">Edit</button>
                    <button class="btn btn-ghost btn-sm" @click="setPreview(d.slug); $store.app.formsTab = 'preview'">Preview</button>
                    <button class="btn btn-ghost btn-sm" @click="$store.app.formsTab = 'subs'">Submissions</button>
                    <button class="btn btn-ghost btn-sm" style="margin-left:auto" @click="deleteForm(d.slug)" >Remove</button>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- Submissions -->
          <div x-show="!loading && !loadError && tab === 'subs'">
            <div x-show="subs.length === 0" class="empty-state">
              <h4>No submissions yet</h4>
              <p class="hint">When someone sends a form — from the web or a Preview test — it lands here and your team picks it up.</p>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px">
              <template x-for="s in subs" :key="s.key">
                <div class="card">
                  <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
                    <span style="font-weight:600;font-size:14px" x-text="(defOf(s.form) ? defOf(s.form).title : s.form)"></span>
                    <span x-show="s.test" class="badge badge-dim" style="font-size:10px">test</span>
                    <span class="badge" :class="s.processed ? 'badge-success' : 'badge-warn'" style="font-size:10px" x-text="s.processed ? 'Picked up' : 'New'"></span>
                    <span class="text-xs text-dim" style="margin-left:auto" x-text="fmtTs(s.ts)"></span>
                  </div>
                  <div style="margin-top:8px;display:flex;flex-direction:column;gap:4px">
                    <template x-for="(row, ri) in answerRows(s)" :key="ri">
                      <div style="display:flex;gap:8px">
                        <span class="text-xs text-dim" style="min-width:110px" x-text="row.label"></span>
                        <span class="text-sm" style="flex:1;min-width:0;white-space:pre-wrap;word-break:break-word" x-text="row.text"></span>
                      </div>
                    </template>
                  </div>
                  <div x-show="contactName(s)" class="text-xs text-dim" style="margin-top:6px">From <span x-text="contactName(s)"></span></div>
                </div>
              </template>
            </div>
          </div>

          <!-- Build: the working copy on the left, its live preview beside it -->
          <div class="fb-editor" x-show="!loading && !loadError && building">
            <template x-if="draft">
              <div>
                <div class="fb-bar">
                  <button class="btn btn-ghost btn-sm" @click="leaveBuilder()">&larr; All forms</button>
                  <span class="badge" :class="draft.published ? 'badge-success' : 'badge-dim'" style="font-size:10px" x-text="draft.published ? 'Published' : 'Draft'"></span>
                  <span class="text-xs text-dim" x-show="draftDirty">Unsaved changes</span>
                  <span style="flex:1"></span>
                  <button class="btn btn-ghost" style="min-height:44px" @click="saveDraft()" :disabled="saving || !draftDirty" x-text="saving ? 'Saving…' : 'Save'"></button>
                  <button class="btn btn-primary" style="min-height:44px" x-show="!draft.published" @click="saveDraft(true)" :disabled="saving">Publish</button>
                  <button class="btn btn-ghost" style="min-height:44px" x-show="draft.published" @click="saveDraft(false)" :disabled="saving">Take down</button>
                </div>
                <label class="stax-field-label" for="fb-title">Form name</label>
                <input id="fb-title" class="form-input" style="width:100%;font-size:17px;font-weight:600" x-model="draft.title" @input="touch()" placeholder="Tattoo consent">
                <div class="fb-link" x-show="draft.published && !draft.isNew">
                  <a :href="formLink(draft.slug)" target="_blank" rel="noopener" x-text="formLink(draft.slug)"></a>
                  <button class="btn btn-ghost btn-sm" @click="copyLink(draft.slug)">Copy link</button>
                </div>
                <p class="text-xs text-dim" style="margin:6px 0 14px" x-show="draft.published && draftDirty">Clients see your changes once you save.</p>

                <div class="fb-blocks">
                  <p class="text-sm text-dim" x-show="draft.fields.length === 0" style="margin:14px 0">This form is empty. Add its first block.</p>
                  <template x-for="(f, i) in draft.fields" :key="f.key">
                    <div class="fb-block" :class="{ 'is-open': openBlock === i }" :data-fb-index="i">
                      <div class="fb-block-head">
                        <button class="fb-block-main" @click="openBlock = openBlock === i ? -1 : i" :aria-expanded="openBlock === i">
                          <span class="fb-block-label" x-text="f.label || fbBlockName(f)"></span>
                          <span class="fb-block-kind"><span x-text="fbBlockName(f)"></span><span x-show="f.required"> · required</span></span>
                        </button>
                        <button class="fb-icon-btn" @click="moveBlock(i, -1)" :disabled="i === 0" :aria-label="'Move ' + (f.label || 'block') + ' up'">&uarr;</button>
                        <button class="fb-icon-btn" @click="moveBlock(i, 1)" :disabled="i === draft.fields.length - 1" :aria-label="'Move ' + (f.label || 'block') + ' down'">&darr;</button>
                      </div>
                      <template x-if="openBlock === i">
                        <div class="fb-settings">
                          <template x-for="(row, ri) in settingsOf(f)" :key="f.key + ri">
                            <div class="fb-setting">
                              <template x-if="row.type === 'text' || row.type === 'number'">
                                <label><span class="stax-field-label" x-text="row.label"></span>
                                  <input class="form-input" style="width:100%" :type="row.type" :value="row.get()" @input="setSetting(row, $event.target.value)"></label>
                              </template>
                              <template x-if="row.type === 'textarea' || row.type === 'lines'">
                                <label><span class="stax-field-label" x-text="row.label + (row.hint ? ' — ' + row.hint.toLowerCase() : '')"></span>
                                  <textarea class="form-textarea" style="width:100%" :rows="row.type === 'lines' ? 5 : 7" :value="row.get()" @change="setSetting(row, $event.target.value); reseed()"></textarea></label>
                              </template>
                              <template x-if="row.type === 'toggle'">
                                <label class="pv-check"><input type="checkbox" :checked="row.get()" @change="setSetting(row, $event.target.checked); reseed()"><span x-text="row.label"></span></label>
                              </template>
                              <template x-if="row.type === 'select'">
                                <label><span class="stax-field-label" x-text="row.label"></span>
                                  <select class="form-select" style="width:100%" @change="setSetting(row, $event.target.value)">
                                    <template x-for="o in row.options" :key="o[0]"><option :value="o[0]" :selected="row.get() === o[0]" x-text="o[1]"></option></template>
                                  </select></label>
                              </template>
                            </div>
                          </template>
                          <div style="display:flex;gap:8px;margin-top:4px">
                            <button class="btn btn-ghost btn-sm" @click="openAdd(i + 1)">+ Add block below</button>
                            <button class="btn btn-ghost btn-sm" style="margin-left:auto;color:var(--error)" @click="removeBlock(i)">Remove block</button>
                          </div>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>

                <button class="btn btn-ghost fb-add" x-show="!adding" @click="openAdd(draft.fields.length)">+ Add block</button>
                <div class="card fb-palette" x-show="adding">
                  <div style="display:flex;align-items:center;margin-bottom:8px">
                    <strong style="flex:1">Add a block</strong>
                    <button class="btn btn-ghost btn-sm" @click="adding = false">Cancel</button>
                  </div>
                  <template x-for="g in palette" :key="g.group">
                    <div>
                      <div class="fb-palette-group" x-text="g.group"></div>
                      <div class="fb-palette-grid">
                        <template x-for="it in g.items" :key="it.name">
                          <button class="fb-palette-item" @click="addBlock(it)" x-text="it.name"></button>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
                <p class="text-sm" style="color:var(--error);margin-top:10px" x-show="draftDirty && draftProblem()" x-text="draftProblem()"></p>
              </div>
            </template>
          </div>

          <!-- Preview -->
          <div :class="{ 'fb-preview': building }" x-show="!loading && !loadError && (tab === 'preview' || building)">
            <div x-show="defs.length === 0 && !building" class="empty-state">
              <h4>Nothing to preview</h4>
              <p class="hint">Once a form exists, you can see it and test it here.</p>
            </div>
            <div x-show="defs.length > 0 || building">
              <div class="fb-preview-title" x-show="building">What clients see</div>
              <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px" x-show="!building">
                <template x-for="d in defs" :key="d.slug">
                  <button class="stax-chip" :class="{ active: previewSlug === d.slug }" @click="setPreview(d.slug)" x-text="d.title"></button>
                </template>
              </div>
              <div class="card" x-show="previewDef">
                <div class="card-header" style="margin:0 0 4px;font-size:16px;font-weight:700" x-text="previewDef ? previewDef.title : ''"></div>
                <p class="text-xs text-dim" style="margin:0 0 12px">This is a test — submitting saves a test submission your team can see. What you see here is what a client sees on the real form.</p>
                <p class="text-sm text-dim" x-show="previewDef && previewDef.fields.length === 0">This form has no fields yet — there is nothing to test.</p>
                <div style="display:flex;flex-direction:column;gap:14px">
                  <template x-for="f in (previewDef ? previewDef.fields : [])" :key="f.key">
                    <div class="pv-field" :data-pv-kind="pvKind(f)" :data-pv-key="f.key">
                      <!-- Heading -->
                      <template x-if="pvKind(f) === 'heading'">
                        <h3 style="margin:2px 0;font-size:15px" x-text="pvText(f) || f.label"></h3>
                      </template>
                      <!-- Paragraph / rich text -->
                      <template x-if="pvKind(f) === 'paragraph'">
                        <div class="pv-text text-sm" x-html="pvRich(pvText(f) || f.label || '')"></div>
                      </template>
                      <!-- Hidden -->
                      <template x-if="pvKind(f) === 'hidden'">
                        <p class="text-xs text-dim" style="margin:0">Hidden field — clients don&rsquo;t see this one. <span x-text="f.label"></span></p>
                      </template>
                      <!-- Every visible, labeled kind -->
                      <template x-if="!['heading','paragraph','hidden'].includes(pvKind(f))">
                        <div>
                          <label class="text-xs text-dim" style="display:block;margin-bottom:4px" x-text="(pvTitle(f) || f.label) + (f.required && !pvExempt(f) ? ' *' : '')"></label>
                          <p class="text-xs text-dim" style="margin:0 0 6px" x-show="pvHelp(f)" x-text="pvHelp(f)"></p>

                          <!-- Simple inputs -->
                          <template x-if="['text','email','phone','website','number','date','initials'].includes(pvKind(f))">
                            <input :type="pvInputType(f)" class="form-input" style="width:100%" :placeholder="pvPlaceholder(f)" x-model="previewData[f.key]">
                          </template>
                          <template x-if="pvKind(f) === 'textarea'">
                            <textarea class="form-textarea" style="width:100%" rows="4" :placeholder="pvPlaceholder(f)" x-model="previewData[f.key]"></textarea>
                          </template>

                          <!-- Dropdown -->
                          <template x-if="pvKind(f) === 'dropdown'">
                            <select class="form-select" style="width:100%" x-model="previewData[f.key]">
                              <option value="">Choose...</option>
                              <template x-for="(o, oi) in pvOptions(f)" :key="oi">
                                <option :value="o.label" x-text="o.label"></option>
                              </template>
                            </select>
                          </template>

                          <!-- Choice: radio or checkbox group -->
                          <template x-if="pvKind(f) === 'choice'">
                            <div style="display:flex;flex-direction:column;gap:6px">
                              <template x-for="(o, oi) in pvOptions(f)" :key="oi">
                                <label class="pv-check">
                                  <input :type="pvCfg(f).allow_multiple ? 'checkbox' : 'radio'" :value="o.label" x-model="previewData[f.key]">
                                  <span x-text="o.label"></span>
                                </label>
                              </template>
                            </div>
                          </template>

                          <!-- Image choice -->
                          <template x-if="pvKind(f) === 'image-choice'">
                            <div style="display:flex;flex-wrap:wrap;gap:8px">
                              <template x-for="(o, oi) in pvOptions(f)" :key="oi">
                                <label class="pv-pill">
                                  <input :type="pvCfg(f).allow_multiple ? 'checkbox' : 'radio'" :value="o.label" x-model="previewData[f.key]">
                                  <img x-show="o.image" :src="o.image" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:6px">
                                  <span x-text="o.label"></span>
                                </label>
                              </template>
                            </div>
                          </template>

                          <!-- Scales -->
                          <template x-if="['scale-number','scale-star','scale-thumbs'].includes(pvKind(f))">
                            <div style="display:flex;flex-wrap:wrap;gap:6px">
                              <template x-for="(o, oi) in pvScaleOpts(f)" :key="oi">
                                <label class="pv-pill">
                                  <input type="radio" :value="o.value" x-model="previewData[f.key]">
                                  <span x-text="o.label"></span>
                                </label>
                              </template>
                            </div>
                          </template>

                          <!-- Checkbox groups (medical, allergy, photo, aftercare list) -->
                          <template x-if="['checks-medical','checks-allergy','checks-photo','checks-photo-sig','checks-list'].includes(pvKind(f))">
                            <div>
                              <div style="display:flex;flex-direction:column;gap:6px">
                                <template x-for="(c, ci) in pvChecksItems(f)" :key="ci">
                                  <label class="pv-check">
                                    <input type="checkbox" :value="c" x-model="previewData[f.key]">
                                    <span x-text="c"></span>
                                  </label>
                                </template>
                              </div>
                              <textarea x-show="['checks-medical','checks-allergy'].includes(pvKind(f))" class="form-textarea" style="width:100%;margin-top:8px" rows="2" placeholder="Anything else we should know?" x-model="previewData[f.key + '_notes']"></textarea>
                              <div x-show="pvKind(f) === 'checks-photo-sig'" class="pv-standin-box" style="margin-top:8px">Signature — clients sign on the real form.</div>
                            </div>
                          </template>

                          <!-- Medical disclosure: two sections -->
                          <template x-if="pvKind(f) === 'disclosure'">
                            <div>
                              <div style="display:flex;flex-direction:column;gap:6px">
                                <template x-for="(c, ci) in pvSec1(f)" :key="ci">
                                  <label class="pv-check">
                                    <input type="checkbox" :value="c" x-model="previewData[f.key + '_conditions']">
                                    <span x-text="c"></span>
                                  </label>
                                </template>
                              </div>
                              <div style="display:flex;flex-direction:column;gap:6px;margin-top:10px">
                                <template x-for="(it, ii) in pvSec2(f)" :key="ii">
                                  <p class="text-sm" style="margin:0"><strong x-show="it.head" x-text="it.head + ': '"></strong><span x-text="it.body"></span></p>
                                </template>
                              </div>
                              <textarea class="form-textarea" style="width:100%;margin-top:8px" rows="2" placeholder="Details" x-model="previewData[f.key + '_details']"></textarea>
                            </div>
                          </template>

                          <!-- Agreements (legal, aftercare, touch-up, deposit, plain consent) -->
                          <template x-if="['agree','consent-agree'].includes(pvKind(f))">
                            <div>
                              <div class="pv-text text-sm" x-show="pvText(f)" x-html="pvRich(pvText(f))" style="margin-bottom:8px"></div>
                              <div style="display:flex;flex-direction:column;gap:6px">
                                <template x-for="(p, pi) in pvAgreeParts(f)" :key="pi">
                                  <label class="pv-check">
                                    <input type="checkbox" x-model="previewData[f.key + p.suffix]">
                                    <span x-text="p.label"></span>
                                  </label>
                                </template>
                              </div>
                            </div>
                          </template>

                          <!-- Composites: client info, tattoo details, description, booking, age check -->
                          <template x-if="['composite-info','composite-details','composite-desc','booking','composite-age'].includes(pvKind(f))">
                            <div>
                              <div style="display:flex;flex-direction:column;gap:10px">
                                <template x-for="(s, si) in pvSubFields(f)" :key="si">
                                  <div>
                                    <label class="text-xs text-dim" style="display:block;margin-bottom:4px" x-text="s.label"></label>
                                    <input x-show="['text','tel','email','date'].includes(s.control)" :type="s.control" class="form-input" style="width:100%" :placeholder="s.placeholder" x-model="previewData[f.key + '_' + s.suffix]">
                                    <textarea x-show="s.control === 'textarea'" class="form-textarea" style="width:100%" rows="3" :placeholder="s.placeholder" x-model="previewData[f.key + '_' + s.suffix]"></textarea>
                                    <select x-show="s.control === 'select'" class="form-select" style="width:100%" x-model="previewData[f.key + '_' + s.suffix]">
                                      <option value="">Choose...</option>
                                      <template x-for="(o, oi) in (s.options || [])" :key="oi">
                                        <option :value="o.value" x-text="o.label"></option>
                                      </template>
                                    </select>
                                  </div>
                                </template>
                              </div>
                              <p class="pv-note" x-show="pvKind(f) === 'composite-age'" x-text="pvAgeNote(f)"></p>
                              <div x-show="pvKind(f) === 'booking'" class="pv-standin-box" style="margin-top:8px">Reference photos — clients upload photos on the real form.</div>
                            </div>
                          </template>

                          <!-- Previous tattoo: yes/no, then the follow-ups when yes -->
                          <template x-if="pvKind(f) === 'composite-prev'">
                            <div style="display:flex;flex-direction:column;gap:10px">
                              <template x-for="(s, si) in pvSubFields(f)" :key="si">
                                <div x-show="s.suffix === 'has_prev' || previewData[f.key + '_has_prev'] === 'yes'">
                                  <label class="text-xs text-dim" style="display:block;margin-bottom:4px" x-text="s.label"></label>
                                  <div x-show="s.control === 'radio-yn'" style="display:flex;gap:14px">
                                    <label class="pv-check"><input type="radio" value="yes" x-model="previewData[f.key + '_has_prev']"><span>Yes</span></label>
                                    <label class="pv-check"><input type="radio" value="no" x-model="previewData[f.key + '_has_prev']"><span>No</span></label>
                                  </div>
                                  <input x-show="s.control === 'text'" type="text" class="form-input" style="width:100%" :placeholder="s.placeholder" x-model="previewData[f.key + '_' + s.suffix]">
                                  <textarea x-show="s.control === 'textarea'" class="form-textarea" style="width:100%" rows="3" :placeholder="s.placeholder" x-model="previewData[f.key + '_' + s.suffix]"></textarea>
                                </div>
                              </template>
                            </div>
                          </template>

                          <!-- Parent consent for a minor -->
                          <template x-if="pvKind(f) === 'minor'">
                            <div>
                              <div class="pv-text text-sm" x-show="pvText(f)" x-html="pvRich(pvText(f))" style="margin-bottom:8px"></div>
                              <p class="pv-note" x-show="pvMinorCfg(f).help" x-text="pvMinorCfg(f).help"></p>
                              <div style="display:flex;flex-direction:column;gap:10px">
                                <div><label class="text-xs text-dim" style="display:block;margin-bottom:4px">Minor&rsquo;s full name</label><input type="text" class="form-input" style="width:100%" x-model="previewData[f.key + '_minor_name']"></div>
                                <div><label class="text-xs text-dim" style="display:block;margin-bottom:4px">Minor&rsquo;s date of birth</label><input type="date" class="form-input" style="width:100%" x-model="previewData[f.key + '_minor_dob']"></div>
                                <div><label class="text-xs text-dim" style="display:block;margin-bottom:4px">Parent or guardian name</label><input type="text" class="form-input" style="width:100%" x-model="previewData[f.key + '_parent_name']"></div>
                                <div><label class="text-xs text-dim" style="display:block;margin-bottom:4px">Relationship to minor</label><input type="text" class="form-input" style="width:100%" x-model="previewData[f.key + '_parent_relationship']"></div>
                                <div><label class="text-xs text-dim" style="display:block;margin-bottom:4px">Parent date of birth</label><input type="date" class="form-input" style="width:100%" x-model="previewData[f.key + '_parent_dob']"></div>
                                <div><label class="text-xs text-dim" style="display:block;margin-bottom:4px">Parent phone</label><input type="tel" class="form-input" style="width:100%" x-model="previewData[f.key + '_parent_phone']"></div>
                                <div x-show="pvMinorCfg(f).requireParentId"><label class="text-xs text-dim" style="display:block;margin-bottom:4px">Parent ID type</label>
                                  <select class="form-select" style="width:100%" x-model="previewData[f.key + '_parent_id_type']">
                                    <option value="">Choose...</option>
                                    <option value="drivers_license">Driver&rsquo;s License</option>
                                    <option value="passport">Passport</option>
                                    <option value="state_id">State ID</option>
                                    <option value="military_id">Military ID</option>
                                  </select>
                                </div>
                                <div x-show="pvMinorCfg(f).requireParentId"><label class="text-xs text-dim" style="display:block;margin-bottom:4px">Parent ID number</label><input type="text" class="form-input" style="width:100%" x-model="previewData[f.key + '_parent_id_number']"></div>
                              </div>
                              <div class="pv-standin-box" style="margin-top:8px">Signatures — the minor and parent sign on the real form.</div>
                              <label class="pv-check" style="margin-top:8px">
                                <input type="checkbox" x-model="previewData[f.key + '_parent_agree']">
                                <span>I am the parent or legal guardian and I consent</span>
                              </label>
                            </div>
                          </template>

                          <!-- Artist picker -->
                          <template x-if="pvKind(f) === 'artist'">
                            <div>
                              <p class="text-sm" x-show="pvArtistFixed(f, artists)" x-text="pvArtistFixed(f, artists) ? ('With ' + pvArtistFixed(f, artists).name) : ''"></p>
                              <select x-show="!pvArtistFixed(f, artists)" class="form-select" style="width:100%" x-model="previewData[f.key]">
                                <option value="">Choose...</option>
                                <template x-for="(a, ai) in artists" :key="ai">
                                  <option :value="a.id" x-text="a.name"></option>
                                </template>
                              </select>
                            </div>
                          </template>

                          <!-- Signature: stand-in pad, typed name when the block allows it -->
                          <template x-if="pvKind(f) === 'signature'">
                            <div>
                              <div x-show="pvSigMode(f) !== 'typed'" class="pv-standin-box">Sign here on the real form</div>
                              <p class="pv-note" x-text="pvStandinNote(f)"></p>
                              <div x-show="pvSigMode(f) !== 'draw'" style="margin-top:8px">
                                <input type="text" class="form-input" style="width:100%" placeholder="Type your full name" x-model="previewData[f.key + '_typed']">
                                <label class="pv-check" style="margin-top:6px">
                                  <input type="checkbox" x-model="previewData[f.key + '_typed_agree']">
                                  <span>My typed name is my signature</span>
                                </label>
                              </div>
                            </div>
                          </template>

                          <!-- Upload -->
                          <template x-if="pvKind(f) === 'upload'">
                            <div>
                              <div class="pv-standin-box">Upload on the real form</div>
                              <p class="pv-note" x-text="pvStandinNote(f)"></p>
                            </div>
                          </template>

                          <!-- Live widgets render as labeled stand-ins -->
                          <template x-if="pvKind(f) === 'widget'">
                            <div class="pv-standin-box" x-text="pvWidgetLine(f)"></div>
                          </template>

                          <!-- Fallback for any kind not listed above: a plain input, never blank -->
                          <template x-if="!['text','email','phone','website','number','date','initials','textarea','dropdown','choice','image-choice','scale-number','scale-star','scale-thumbs','checks-medical','checks-allergy','checks-photo','checks-photo-sig','checks-list','disclosure','agree','consent-agree','composite-info','composite-details','composite-desc','booking','composite-age','composite-prev','minor','artist','signature','upload','widget'].includes(pvKind(f))">
                            <input type="text" class="form-input" style="width:100%" :placeholder="pvPlaceholder(f)" x-model="previewData[f.key]">
                          </template>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>
                <button class="btn btn-primary" style="margin-top:14px;min-height:44px" @click="submitPreview()" :disabled="submitting">Send test submission</button>
                <span x-show="submitted" class="text-sm" style="color:var(--accent);margin-left:10px">Saved — check Submissions.</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>
