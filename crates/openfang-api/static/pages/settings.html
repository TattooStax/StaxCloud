
    <!-- System corner: owner surfaces. Settings and Connections are plain
         lists; the machinery they used to show lives under Advanced. A
         setting without an owner control is an Ask Stax row, never a toggle. -->
    <template x-if="page === 'settings'">
      <div class="sys-page">
        <div class="page-header"><h2>Settings</h2><button class="btn btn-ghost" @click="$store.app.staxAgent(); goSurface('home')" aria-label="Done, back to Stax">Done</button></div>
        <div class="page-body">
          <ul class="sys-list" aria-label="Settings">
            <li class="sys-row">
              <span class="sys-text"><span class="sys-name" id="sys-appearance">Appearance</span><span class="sys-sub">How StaxCloud looks on this device</span></span>
              <span class="sys-seg" role="radiogroup" aria-labelledby="sys-appearance">
                <button role="radio" :aria-checked="themeMode === 'light'" :class="{ 'is-on': themeMode === 'light' }" @click="setTheme('light')">Light</button>
                <button role="radio" :aria-checked="themeMode === 'system'" :class="{ 'is-on': themeMode === 'system' }" @click="setTheme('system')">Auto</button>
                <button role="radio" :aria-checked="themeMode === 'dark'" :class="{ 'is-on': themeMode === 'dark' }" @click="setTheme('dark')">Dark</button>
              </span>
            </li>
            <li><button class="sys-row" @click="askStax('I want to update my shop details.')"><span class="sys-text"><span class="sys-name">Shop details</span><span class="sys-sub">Name, hours, and what you offer</span></span><span class="sys-ask"><svg aria-hidden="true"><use href="#stax-reaper"/></svg>Ask Stax</span></button></li>
            <li><button class="sys-row" @click="askStax('What does Stax check with me before doing? I want to change that.')"><span class="sys-text"><span class="sys-name">What Stax checks with you first</span><span class="sys-sub">Texts, posts, and anything that spends money</span></span><span class="sys-ask"><svg aria-hidden="true"><use href="#stax-reaper"/></svg>Ask Stax</span></button></li>
            <li><button class="sys-row" @click="askStax('I want to set a monthly spending limit.')"><span class="sys-text"><span class="sys-name">Spending limit</span><span class="sys-sub">A monthly cap on what Stax can spend</span></span><span class="sys-ask"><svg aria-hidden="true"><use href="#stax-reaper"/></svg>Ask Stax</span></button></li>
            <li><button class="sys-row" @click="$store.app.staxAgent(); navigate('chat')"><span class="sys-text"><span class="sys-name">Report a bug</span></span><svg class="sys-chev" aria-hidden="true"><use href="#g-chev"/></svg></button></li>
            <li x-show="$store.app.sessionUser"><button class="sys-row sys-row--quiet" @click="$store.app.sessionLogout()"><span class="sys-text"><span class="sys-name">Sign out</span></span></button></li>
          </ul>
          <p class="sys-ident">Fargo Tattoo runs StaxCloud<span x-show="connected && version" x-text="' ' + version"></span>.</p>
        </div>
      </div>
    </template>
