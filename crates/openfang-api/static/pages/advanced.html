
    <!-- System > Advanced: the index of the demoted consoles. Machinery is
         allowed here and nowhere above it. -->
    <template x-if="page === 'advanced'">
      <div class="sys-page">
        <div class="page-header"><h2>Advanced</h2><button class="btn btn-ghost" @click="$store.app.staxAgent(); goSurface('home')" aria-label="Done, back to Stax">Done</button></div>
        <div class="page-body">
          <p class="sys-lede">The full controls behind StaxCloud, kept as they were. Most changes are easier by asking Stax.</p>
          <ul class="sys-list" aria-label="Advanced">
            <li><button class="sys-row" @click="navigate('configuration')"><span class="sys-text"><span class="sys-name">Settings console</span><span class="sys-sub">Providers, models, config, tools, security, network, budget</span></span><svg class="sys-chev" aria-hidden="true"><use href="#g-chev"/></svg></button></li>
            <li><button class="sys-row" @click="navigate('integrations')"><span class="sys-text"><span class="sys-name">Integrations catalog</span><span class="sys-sub">Every channel adapter and its setup</span></span><svg class="sys-chev" aria-hidden="true"><use href="#g-chev"/></svg></button></li>
            <li><button class="sys-row" @click="navigate('agents')"><span class="sys-text"><span class="sys-name">Helpers</span></span><svg class="sys-chev" aria-hidden="true"><use href="#g-chev"/></svg></button></li>
            <li><button class="sys-row" @click="navigate('overview')"><span class="sys-text"><span class="sys-name">Overview</span></span><svg class="sys-chev" aria-hidden="true"><use href="#g-chev"/></svg></button></li>
            <li><button class="sys-row" @click="navigate('comms')"><span class="sys-text"><span class="sys-name">Team traffic</span></span><svg class="sys-chev" aria-hidden="true"><use href="#g-chev"/></svg></button></li>
            <li><button class="sys-row" @click="navigate('logs')"><span class="sys-text"><span class="sys-name">Diagnostics</span></span><svg class="sys-chev" aria-hidden="true"><use href="#g-chev"/></svg></button></li>
            <li><button class="sys-row" @click="navigate('runtime')"><span class="sys-text"><span class="sys-name">System status</span></span><svg class="sys-chev" aria-hidden="true"><use href="#g-chev"/></svg></button></li>
            <li><button class="sys-row" @click="navigate('setup')"><span class="sys-text"><span class="sys-name">Step-by-step setup</span></span><svg class="sys-chev" aria-hidden="true"><use href="#g-chev"/></svg></button></li>
            <li><button class="sys-row" @click="navigate('workflows')"><span class="sys-text"><span class="sys-name">Automations</span></span><svg class="sys-chev" aria-hidden="true"><use href="#g-chev"/></svg></button></li>
            <li><button class="sys-row" @click="navigate('scheduler')"><span class="sys-text"><span class="sys-name">Scheduled</span></span><svg class="sys-chev" aria-hidden="true"><use href="#g-chev"/></svg></button></li>
            <li><button class="sys-row" @click="navigate('hands')"><span class="sys-text"><span class="sys-name">Playbooks</span></span><svg class="sys-chev" aria-hidden="true"><use href="#g-chev"/></svg></button></li>
            <li><button class="sys-row" @click="navigate('skills')"><span class="sys-text"><span class="sys-name">Capabilities</span></span><svg class="sys-chev" aria-hidden="true"><use href="#g-chev"/></svg></button></li>
            <li><button class="sys-row" @click="navigate('canvas')"><span class="sys-text"><span class="sys-name">Design bench</span><span class="sys-sub">The old Canvas. Designs are now made by asking Stax in chat</span></span><svg class="sys-chev" aria-hidden="true"><use href="#g-chev"/></svg></button></li>
            <li><button class="sys-row" @click="navigate('sessions')"><span class="sys-text"><span class="sys-name">History</span></span><svg class="sys-chev" aria-hidden="true"><use href="#g-chev"/></svg></button></li>
            <li><button class="sys-row" @click="navigate('analytics')"><span class="sys-text"><span class="sys-name">Reports</span></span><svg class="sys-chev" aria-hidden="true"><use href="#g-chev"/></svg></button></li>
            <li><button class="sys-row" @click="$store.app.r4Open = true"><span class="sys-text"><span class="sys-name">Side chats</span></span><svg class="sys-chev" aria-hidden="true"><use href="#g-chev"/></svg></button></li>
          </ul>
          <p class="sys-ident sys-ident--mark"><svg aria-hidden="true"><use href="#sd-mark"/></svg><span>StaxCloud<span x-show="connected && version" x-text="' ' + version"></span></span></p>
        </div>
      </div>
    </template>
