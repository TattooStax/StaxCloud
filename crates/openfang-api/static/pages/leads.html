
    <!-- Page: Leads (pipeline) -->
    <template x-if="page === 'leads'">
      <div x-data="leadsPage" x-init="loadData()">
        <div class="page-header">
          <h2>Leads</h2>
          <div style="display:flex;gap:8px">
            <button class="btn btn-ghost btn-sm" @click="loadData()">Refresh</button>
          <button class="btn btn-ghost" @click="$store.app.staxAgent(); goSurface('home')" aria-label="Done, back to Stax">Done</button>
          </div>
        </div>
        <div class="page-body">
          <div x-show="loading" class="text-dim" style="padding:12px">Loading leads...</div>
          <div x-show="!loading && error" class="error-state">
            <h3 style="color:var(--error)">Could not load leads</h3>
            <p class="text-xs text-dim" x-text="error"></p>
            <button class="btn btn-primary btn-sm" @click="loadData()" style="margin-top:8px">Retry</button>
          </div>
          <div x-show="!loading && !error && leads.length === 0" class="empty-state">
            <p>No leads yet. New inquiries and form replies land here.</p>
          </div>
          <div x-show="!loading && !error && leads.length > 0">
            <p class="leads-summary" x-text="summaryLine()"></p>
            <template x-for="stage in stages" :key="stage">
              <section class="lead-stage">
                <button class="lead-stage-head" :aria-expanded="openStages[stage]" @click="openStages[stage] = !openStages[stage]">
                  <span x-text="stage"></span>
                  <span class="lead-stage-count" x-text="stageCount(stage)"></span>
                  <svg class="lead-stage-chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
                </button>
                <div x-show="openStages[stage]">
                  <div class="lead-list" x-show="stageCount(stage) > 0">
                    <template x-for="lead in byStage(stage)" :key="lead._key">
                      <article class="lead-card" @click="openPerson(lead)">
                        <div class="lead-card-top">
                          <button class="lead-name lead-open" @click.stop="openPerson(lead)" :aria-label="'Open ' + lead.name + ' in Contacts'" x-text="lead.name"></button>
                          <span class="lead-temp" x-show="lead._temp" :data-temp="lead._temp" x-text="lead._temp"></span>
                        </div>
                        <p class="lead-idea" x-show="lead._idea" x-text="'&ldquo;' + lead._idea + '&rdquo;'"></p>
                        <div class="lead-meta">
                          <span x-text="lead._artistLabel"></span>
                          <span aria-hidden="true">·</span>
                          <span x-show="lead._lastLabel">Last contact <span x-text="lead._lastLabel"></span></span>
                          <span x-show="!lead._lastLabel">No contact yet</span>
                        </div>
                        <p class="lead-next" x-text="lead._next"></p>
                        <div class="lead-actions" x-show="lead._action">
                          <button class="btn btn-primary btn-sm lead-act" @click.stop="runAction(lead)" :disabled="lead._holding || lead._held" x-text="lead._held ? 'Held in Needs you' : (lead._action ? lead._action.label : '')"></button>
                        </div>
                      </article>
                    </template>
                    <button class="btn btn-ghost lead-more" x-show="moreCount(stage) > 0" @click="showMore(stage)">Show more · <span x-text="moreCount(stage)"></span> more</button>
                  </div>
                  <p class="lead-stage-empty" x-show="stageCount(stage) === 0">No leads here right now.</p>
                </div>
              </section>
            </template>
          </div>
        </div>
      </div>
    </template>
