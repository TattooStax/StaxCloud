<!-- Auth Prompt (API Key or Username/Password) -->
<div x-show="$store.app.showAuthPrompt" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px)" x-data="{ apiKeyInput: '', loginPass: '' }">
  <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--surface,#1e1e2e);border:1px solid var(--border,#333);border-radius:14px;padding:2.25rem 2rem;max-width:400px;width:92%;box-shadow:0 24px 60px rgba(0,0,0,0.45)">
    <div style="text-align:center;margin-bottom:1.5rem">
      <svg class="auth-reaper" width="72" height="72" aria-hidden="true"><use href="#stax-reaper"/></svg>
      <div style="font-size:1.45rem;font-weight:700;letter-spacing:-0.01em;margin-top:0.6rem">StaxCloud</div>
      <div style="color:var(--text-dim,#888);font-size:0.82rem;margin-top:0.25rem">Run your business. Grow your business.<br>One intelligent system.</div>
    </div>
    <!-- Session login mode -->
    <template x-if="$store.app.authMode === 'session'">
      <div>
        <h3 style="margin:0 0 0.5rem;font-size:1rem">Sign in</h3>
        <p style="color:var(--text-dim,#888);font-size:0.85rem;margin:0 0 1rem">Enter the dashboard password.</p>
<input type="password" x-model="loginPass" placeholder="Password" autocomplete="current-password" @keydown.enter="$store.app.sessionLogin('admin', loginPass)" style="width:100%;padding:0.75rem;border-radius:10px;border:1px solid var(--border,#333);background:var(--bg,#151520);color:var(--text,#e0e0e0);font-size:0.95rem;box-sizing:border-box;margin-bottom:0.75rem;min-height:48px">
        <button @click="$store.app.sessionLogin('admin', loginPass)" style="width:100%;padding:0.8rem;border-radius:10px;border:none;background:var(--accent,#146e68);color:var(--text-on-accent);font-weight:600;cursor:pointer;font-size:0.95rem;min-height:48px">Sign in</button>
      </div>
    </template>
    <!-- API key mode -->
    <template x-if="$store.app.authMode === 'apikey'">
      <div>
        <h3 style="margin:0 0 0.5rem;font-size:1.1rem">API Key Required</h3>
        <p style="color:var(--text-dim,#888);font-size:0.85rem;margin:0 0 0.5rem">This instance requires an API key. Enter the key from your <code>config.toml</code>.</p>
        <p style="color:var(--text-dim,#666);font-size:0.75rem;margin:0 0 1rem">Add <code style="color:var(--accent-light,#5cbcae);background:var(--bg,#111);padding:1px 4px;border-radius:2px">api_key = "your-key"</code> at the <strong>top</strong> of <code>~/.openfang/config.toml</code> (not under any [section]).</p>
        <input type="password" x-model="apiKeyInput" placeholder="Enter API key..." @keydown.enter="$store.app.submitApiKey(apiKeyInput)" style="width:100%;padding:0.6rem;border-radius:6px;border:1px solid var(--border,#333);background:var(--bg,#151520);color:var(--text,#e0e0e0);font-size:0.9rem;box-sizing:border-box;margin-bottom:0.75rem">
        <button @click="$store.app.submitApiKey(apiKeyInput)" style="width:100%;padding:0.6rem;border-radius:6px;border:none;background:var(--accent,#146e68);color:var(--text-on-accent);font-weight:600;cursor:pointer;font-size:0.9rem">Unlock Dashboard</button>
      </div>
    </template>
  </div>
</div>

<div class="app-layout" :class="{ 'focus-mode': $store.app.focusMode }">
  <!-- Main Content -->
  <main class="main-content">
    <!-- Shell bar: the menu button. Each screen's title lives in the page's
         own header; sub-navigation lives in a module dock or the side card. -->
    <div class="stax-chips" x-cloak x-show="page !== 'chat'">
      <button class="stax-menu-btn" @click="$store.app.sideOpen = !$store.app.sideOpen" :aria-expanded="$store.app.sideOpen ? 'true' : 'false'" aria-controls="stax-side" aria-label="Menu" title="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
